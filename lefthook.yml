pre-commit:
  commands:
    sunspec-codegen:
      # Unconditional rather than glob-scoped to the sunspec-gen crate: the models submodule
      # (crates/sunspec-gen/models) can also move without touching any ordinary file inside it,
      # and a glob wouldn't reliably catch that. Regeneration itself is a few seconds.
      run: >-
        cargo run --quiet -p sunspec-gen &&
        git add crates/sunspec-modbus-lib-rs/src/sunspec crates/sunspec-modbus-lib-static/src/generated.rs
